<!DOCTYPE html>
<!--
    TaskFlow - Task Management Application
    ======================================
    Single-page application using HTML, CSS and JavaScript.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Management App</title>

    <link rel="stylesheet" href="styles/main.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="icon">📋</span>
                    TaskFlow
                </h1>

                <p class="app-subtitle">Streamline your productivity</p>
            </div>
        </header>

        <main class="main">

            <!-- Task Creation -->
            <section class="task-input-section">
                <div class="input-container">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                        class="task-input"
                        maxlength="500"
                        aria-label="Task description"
                    >

                    <!-- Category selector -->
                    <select
                        id="taskCategory"
                        class="task-category-select"
                        aria-label="Task category"
                    >
                        <option value="Work">Work</option>
                        <option value="Personal" selected>Personal</option>
                        <option value="Shopping">Shopping</option>
                    </select>

                    <button id="addTaskBtn" class="add-btn" type="button">
                        <span class="add-icon">+</span>
                        Add Task
                    </button>

                </div>
            </section>

            <!-- Task List -->
            <section class="tasks-section">

                <div class="tasks-header">
                    <h2>Your Tasks</h2>

                    <span id="taskCount" class="task-count">
                        0 tasks
                    </span>
                </div>

                <!-- Category Filtering -->
                <div class="task-filter-container">
                    <label for="categoryFilter">Filter by category:</label>

                    <select
                        id="categoryFilter"
                        class="task-category-select"
                    >
                        <option value="All">All Categories</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Uncategorized">Uncategorized</option>
                    </select>
                </div>

                <!-- Tasks are rendered dynamically by app.js -->
                <div id="tasksList" class="tasks-list">
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">✨</div>

                    <h3>No tasks yet</h3>

                    <p>Add your first task above to get started!</p>
                </div>

            </section>

            <!-- Statistics -->
            <section class="stats-section">
                <div class="stats-grid">

                    <div class="stat-card">
                        <span class="stat-number" id="totalTasks">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>

                    <div class="stat-card">
                        <span class="stat-number" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </div>

                    <div class="stat-card">
                        <span class="stat-number" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </div>

                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>
                &copy; 2024 TaskFlow.
                Built with HTML, CSS, and JavaScript.
            </p>
        </footer>

    </div>

    <!-- Application JavaScript -->
    <script src="scripts/app.js"></script>

</body>
</html>
